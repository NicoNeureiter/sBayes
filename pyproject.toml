[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sbayes"
version = "1.1"
description = "MCMC algorithms to identify spatial cluster in the presence of confounding effects."
authors = [
    {name = "Nico Neureiter", email = "nico.neureiter@bsse.ethz.ch"},
    {name = "Peter Ranacher", email = "peter.ranacher@gmail.com"},
]
readme = "README.md"
keywords = ["Bayesian inference", "clustering", "linguistics"]
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas>=2.1",
    "scipy",
    "pyproj",
    "tables",
    "pydantic>=2",
    "ruamel.yaml",
    "unidecode",
    "jax",
    "numpyro",
]

[project.optional-dependencies]
tools = ["arviz>=1", "matplotlib", "seaborn"]

[project.urls]
Source = "https://github.com/derpetermann/sBayes"
Documentation = "https://github.com/derpetermann/sBayes/blob/devel/documentation/user_manual.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["sbayes*"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:object name is not a valid Python identifier:tables.exceptions.NaturalNameWarning",
]

[tool.setuptools.package-data]
maps = ["*.geojson"]

[project.scripts]
sbayes = "sbayes.cli:cli"
sbayesELPD = "sbayes.tools.elpd:cli"
sbayesGuessFeatureTypes = "sbayes.tools.guess_feature_types:main"
sbayesEstimatePrior = "sbayes.tools.estimate_empirical_prior:main"
sbayesMigrateResults = "sbayes.tools.migrate_results:cli"
sbayesFindCorrelatedFeatures = "sbayes.tools.find_correlated_features:main"
sbayesConvertPriorCounts = "sbayes.tools.convert_prior_csv_to_json:main"